name: Inspect MTGJSON (temporary)
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/inspect-mtgjson.yml
jobs:
  look:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: tools
      - run: |
          pip install -q ijson
          cd "$RUNNER_TEMP"
          curl -sfo prices.json.xz https://mtgjson.com/api/v5/AllPrices.json.xz && xz -d prices.json.xz
          curl -sfo csv.tar.xz https://mtgjson.com/api/v5/AllPrintingsCSVFiles.tar.xz && tar -xJf csv.tar.xz && find . -name cardIdentifiers.csv -exec cp {} ids.csv \;
          mkdir -p out
          /usr/bin/time -v python3 "$GITHUB_WORKSPACE/tools/price-history.py" out prices.json ids.csv 2>&1 | grep -E "history:|Maximum resident|Elapsed"
          du -sh out/history; ls out/history | wc -l; cat out/history/meta.json; echo
          gzip -c out/history/a1b.json | wc -c; ls -la out/history/a1b.json
          python3 -c "
          import json,glob
          n=c=0;mx=0
          for f in glob.glob('out/history/*.json'):
            if f.endswith('meta.json'): continue
            d=json.load(open(f))
            for k,v in d.items():
              for s,p in v.items(): n+=1; c+=len(p); mx=max(mx,len(p))
          print('series',n,'points',c,'avg',c/max(n,1),'max',mx)
          d=json.load(open('out/history/a1b.json')); k=next(iter(d)); print(k, json.dumps(d[k])[:600])
          "
