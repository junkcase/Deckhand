name: Store prices
# Once a day: copy Mana Pool's and Card Kingdom's public price lists (cards and sealed products) to the "data" branch, which Deckhand reads
# (neither can be read straight from a website), add today's prices to the price history behind the card charts, and
# copy Commander Spellbook's combo list (its API only answers its own website) for the Combos tab.
# The branch keeps only the latest copy; if one download fails, yesterday's copy of that part stays.
on:
  schedule:
    - cron: "41 10 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: store-prices
  cancel-in-progress: false
jobs:
  mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: tools
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Start from yesterday's copy
        run: |
          git clone -q --depth 1 -b data "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" "$RUNNER_TEMP/out" || mkdir -p "$RUNNER_TEMP/out"
          rm -rf "$RUNNER_TEMP/out/.git"
      - name: Mana Pool
        run: node tools/manapool-mirror.js "$RUNNER_TEMP/out" || echo "::warning::Mana Pool download failed; keeping yesterday's copy"
      - name: Card Kingdom
        run: node tools/cardkingdom-mirror.js "$RUNNER_TEMP/out" || echo "::warning::Card Kingdom download failed; keeping yesterday's copy"
      - name: Sealed products (Mana Pool and Card Kingdom sealed price lists)
        run: node tools/sealed-mirror.js "$RUNNER_TEMP/out" || echo "::warning::Sealed prices not updated today; keeping yesterday's copy"
      - name: Price history (TCGplayer and Card Kingdom from MTGJSON, plus today's Mana Pool)
        run: |
          pip install -q ijson
          mkdir -p "$RUNNER_TEMP/mtgjson" && cd "$RUNNER_TEMP/mtgjson"
          if curl -sfo prices.json.xz https://mtgjson.com/api/v5/AllPrices.json.xz && xz -d prices.json.xz \
            && curl -sfo csv.tar.xz https://mtgjson.com/api/v5/AllPrintingsCSVFiles.tar.xz && tar -xJf csv.tar.xz && find . -name cardIdentifiers.csv -exec cp {} ids.csv \; && find . -name cards.csv -exec cp {} cards.csv \; && test -s ids.csv; then
            cp -r "$RUNNER_TEMP/out/history" history-yesterday 2>/dev/null || true
            python3 "$GITHUB_WORKSPACE/tools/price-history.py" "$RUNNER_TEMP/out" prices.json ids.csv cards.csv || { echo "::warning::Price history failed; keeping yesterday's copy"; rm -rf "$RUNNER_TEMP/out/history"; cp -r history-yesterday "$RUNNER_TEMP/out/history" 2>/dev/null || true; }
          else
            echo "::warning::MTGJSON download failed; keeping yesterday's price history"
          fi
          rm -rf "$RUNNER_TEMP/mtgjson"
      - name: Market opportunities (uses the price history above plus Scryfall's daily card file)
        run: |
          pip install -q ijson
          UA="Deckhand/1.0 (github.com/junkcase/Deckhand)"
          URL=$(curl -sf -H "User-Agent: $UA" -H "Accept: application/json" https://api.scryfall.com/bulk-data | python3 -c "import json,sys; b=[x for x in json.load(sys.stdin)['data'] if x['type'] == 'default_cards'][0]; print(b.get('jsonl_download_uri') or b.get('download_uri'))" || true)
          echo "card file: $URL"; [ "${URL:0:8}" = "https://" ] \
            && curl -sf -H "User-Agent: $UA" -o "$RUNNER_TEMP/cards.jsonl$([[ $URL == *.gz ]] && echo .gz)" "$URL" \
            && python3 tools/opportunities.py "$RUNNER_TEMP/out" "$(ls "$RUNNER_TEMP"/cards.jsonl* | head -1)" \
            || echo "::warning::Opportunities not updated today; keeping yesterday's copy"
          rm -f "$RUNNER_TEMP"/cards.jsonl*
      - name: Combos (Commander Spellbook)
        run: |
          pip install -q ijson
          curl -sfo "$RUNNER_TEMP/combos.json.gz" https://json.commanderspellbook.com/variants.json.gz \
            && python3 tools/combos-mirror.py "$RUNNER_TEMP/out" "$RUNNER_TEMP/combos.json.gz" \
            || echo "::warning::Combo list download failed; keeping yesterday's copy"
          rm -f "$RUNNER_TEMP/combos.json.gz" "$RUNNER_TEMP/out/combos/all.json.tmp"
      - name: Publish to the data branch (latest copy only)
        run: |
          cd "$RUNNER_TEMP/out"
          git init -q -b data
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "Store prices $(date -u +%F)"
          git push -q --force "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" data
