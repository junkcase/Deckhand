<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#16202b">
<title>Deckhand</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo+Narrow:wght@500;600;700&family=Source+Sans+3:wght@400;600;700&display=swap">
<style>
/* Layout: one-screen phone app — sticky header, scrolling view, fixed bottom tab bar; sheets slide up from the bottom. */
:root{
  --bg:#eef1f4; --surface:#ffffff; --sunk:#e3e8ee; --ink:#16202b; --muted:#5a6878; --line:#d3dae2;
  --accent:#1d5f8f; --accent-ink:#ffffff; --gold:#9a6a12; --danger:#b23a2a; --ok:#2c7a4b;
  --mW:#efe5bd; --mU:#2f7fc1; --mB:#3b3340; --mR:#d3452f; --mG:#2f8a4f; --mC:#a7acb3; --mN:#c9ced5;
  --f-display:"Archivo Narrow","Arial Narrow",Arial,sans-serif;
  --f-body:"Source Sans 3",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --nav-h:62px;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0f141a; --surface:#18202a; --sunk:#121920; --ink:#e5eaf0; --muted:#93a1b1; --line:#2a3543;
  --accent:#62a9dc; --accent-ink:#0b1620; --gold:#e1b14f; --danger:#ef7462; --ok:#5cc489;
  --mN:#4a5563; color-scheme:dark;
}}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 var(--f-body);-webkit-tap-highlight-color:transparent}
img{max-width:100%}
[hidden]{display:none!important}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}

header.top{position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:1px solid var(--line);
  padding:calc(env(safe-area-inset-top,0px) + 10px) max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));
  display:flex;align-items:baseline;justify-content:space-between;gap:12px}
header.top h1{margin:0;font:700 22px/1.1 var(--f-display);letter-spacing:.02em}
header.top .sub{font-size:13px;color:var(--muted)}
main{padding:14px max(16px,env(safe-area-inset-right,0px)) calc(var(--nav-h) + env(safe-area-inset-bottom,0px) + 24px) max(16px,env(safe-area-inset-left,0px));max-width:900px;margin:0 auto}

nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);
  display:grid;grid-template-columns:repeat(4,1fr);padding:0 env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)}
nav.tabs button{background:none;border:0;height:var(--nav-h);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  font:600 12px var(--f-display);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
nav.tabs button svg{width:24px;height:24px}
nav.tabs button[aria-current="page"]{color:var(--accent)}

.row{display:flex;gap:8px;align-items:center}
.wrap{flex-wrap:wrap}
.grow{flex:1;min-width:0}
.stack{display:flex;flex-direction:column;gap:12px}
.label{font:600 12px var(--f-display);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}
.small{font-size:13px}
input[type=text],input[type=search],select,textarea{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-height:44px;width:100%}
textarea{min-height:140px;resize:vertical}
select{width:auto}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;min-height:44px;padding:0 14px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{color:var(--danger)}
.btn.ghost{background:none;border-color:transparent}
.btn.sm{min-height:34px;padding:0 10px;font-size:14px;border-radius:8px}
.btn:disabled{opacity:.5;cursor:default}
.chip{display:inline-flex;align-items:center;gap:4px;font:600 11px var(--f-display);letter-spacing:.06em;text-transform:uppercase;padding:2px 7px;border-radius:999px;border:1px solid var(--line);color:var(--muted)}
.chip.foil{border-color:var(--gold);color:var(--gold)}
.chip.warn{border-color:var(--danger);color:var(--danger)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:14px}

.pip{display:inline-grid;place-items:center;width:18px;height:18px;border-radius:50%;font:700 10px/1 var(--f-display);font-style:normal;background:var(--mN);color:#111;margin-right:1px;vertical-align:-3px}
.pip.pW{background:var(--mW)}.pip.pU{background:var(--mU);color:#fff}.pip.pB{background:var(--mB);color:#fff}
.pip.pR{background:var(--mR);color:#fff}.pip.pG{background:var(--mG);color:#fff}.pip.pC{background:var(--mC)}
.pip.pH{width:auto;padding:0 4px;border-radius:9px}

/* summary strip */
.summary{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.summary div{background:var(--surface);padding:10px 12px}
.summary b{display:block;font:700 22px/1.1 var(--f-display)}
.summary b.gold{color:var(--gold)}

/* lists */
.list{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.item{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px 10px;border-top:1px solid var(--line)}
.item:first-child{border-top:0}
.item img,.thumb{width:44px;height:61px;object-fit:cover;border-radius:4px;background:var(--sunk);display:block}
.item .name{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .meta{font-size:13px;color:var(--muted);display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.item .right{text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.tap{background:none;border:0;padding:0;text-align:left;width:100%;min-width:0}
.stepper{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.stepper button{border:0;background:var(--sunk);width:30px;height:30px;font-weight:700}
.stepper span{min-width:28px;text-align:center;font-weight:600}
.price{font-weight:600}
.price.gold{color:var(--gold)}
.group-h{padding:8px 10px;background:var(--sunk);font:600 12px var(--f-display);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);display:flex;justify-content:space-between}

/* search grid */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:8px}
.grid button{border:0;padding:0;background:none;border-radius:6px;overflow:hidden;aspect-ratio:63/88;background:var(--sunk);position:relative}
.grid img{width:100%;height:100%;object-fit:cover;display:block}
.grid .fallback{position:absolute;inset:0;display:grid;place-items:center;padding:6px;font-size:12px;text-align:center}
.grid .pr{position:absolute;right:4px;bottom:4px;background:rgba(10,15,20,.78);color:#fff;font:600 11px var(--f-display);padding:1px 5px;border-radius:4px}

.empty{background:var(--surface);border:1px dashed var(--line);border-radius:12px;padding:24px 18px;text-align:center;display:flex;flex-direction:column;gap:10px;align-items:center}
.empty h2{margin:0;font:700 20px var(--f-display)}
.empty p{margin:0;color:var(--muted);max-width:34ch}

/* scanner */
.cam{position:relative;background:#000;border-radius:14px;overflow:hidden;height:min(62vh,560px)}
.cam video{width:100%;height:100%;object-fit:cover;display:block}
.cam .frame{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);border:2px solid rgba(255,255,255,.9);border-radius:12px;box-shadow:0 0 0 2000px rgba(0,0,0,.38)}
.cam .band{position:absolute;left:3%;right:3%;border:1.5px dashed #ffd76a;border-radius:4px}
.cam .band.name{top:3%;height:7.5%;right:20%}
.cam .band.info{bottom:2.5%;height:8%;right:52%}
.cam .hint{position:absolute;left:0;right:0;top:10px;text-align:center;color:#fff;font-size:13px;text-shadow:0 1px 3px #000}
.cam .ctrl{position:absolute;left:0;right:0;bottom:12px;display:flex;justify-content:center;align-items:center;gap:22px}
.shutter{width:70px;height:70px;border-radius:50%;border:4px solid #fff;background:rgba(255,255,255,.25)}
.shutter:active{background:rgba(255,255,255,.6)}
.round{width:46px;height:46px;border-radius:50%;border:0;background:rgba(0,0,0,.55);color:#fff;display:grid;place-items:center}
.round[aria-pressed="true"]{background:#ffd76a;color:#000}
.status{min-height:22px;font-size:14px;color:var(--muted)}
.match{display:grid;grid-template-columns:96px minmax(0,1fr);gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px}
.match img{width:96px;border-radius:6px;display:block}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:var(--surface);padding:6px 10px;font-size:14px;font-weight:600}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.toggle{display:flex;align-items:center;gap:8px;font-size:14px}
.toggle input{width:20px;height:20px;accent-color:var(--accent)}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(5,10,15,.55);z-index:40}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;background:var(--bg);border-radius:16px 16px 0 0;max-height:92vh;overflow:auto;
  padding:8px max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));max-width:720px;margin:0 auto}
.sheet .grab{width:44px;height:5px;border-radius:3px;background:var(--line);margin:4px auto 10px}
.sheet h2{margin:0;font:700 24px/1.15 var(--f-display);text-wrap:balance}
.big{width:100%;max-width:300px;border-radius:12px;display:block;margin:0 auto;aspect-ratio:63/88;object-fit:cover;background:var(--sunk)}
.oracle{white-space:pre-wrap;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:15px}
.prices{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.prices div{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:6px 8px}
.prices b{display:block;font:700 16px var(--f-display)}
.card-box{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:10px}
.prints{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}
.prints button{flex:0 0 84px;border:2px solid transparent;border-radius:6px;padding:0;background:none}
.prints button[aria-pressed="true"]{border-color:var(--accent)}
.prints img{width:100%;border-radius:4px;display:block}
.prints small{display:block;font-size:11px;color:var(--muted)}

/* deck */
.deck-card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;justify-content:space-between;gap:12px;align-items:center;text-align:left;width:100%}
.deck-card h3{margin:0;font:700 18px var(--f-display)}
.curve{display:grid;grid-template-columns:repeat(8,1fr);gap:4px;align-items:end;height:110px;padding-top:14px}
.curve .bar{background:var(--accent);border-radius:3px 3px 0 0;position:relative;min-height:2px}
.curve .bar span{position:absolute;top:-16px;left:0;right:0;text-align:center;font-size:11px;color:var(--muted)}
.curve-x{display:grid;grid-template-columns:repeat(8,1fr);gap:4px;font-size:11px;color:var(--muted);text-align:center}
.hand{display:grid;grid-template-columns:repeat(auto-fill,minmax(80px,1fr));gap:6px}
.hand img{width:100%;border-radius:5px;display:block}
.ac{position:relative}
.ac ul{position:absolute;left:0;right:0;top:100%;z-index:15;list-style:none;margin:4px 0 0;padding:4px;background:var(--surface);border:1px solid var(--line);border-radius:10px;max-height:260px;overflow:auto;box-shadow:0 8px 24px rgba(0,0,0,.18)}
.ac li button{width:100%;text-align:left;background:none;border:0;padding:10px;border-radius:6px}
.ac li button:hover{background:var(--sunk)}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--nav-h) + env(safe-area-inset-bottom,0px) + 14px);z-index:60;background:var(--ink);color:var(--bg);
  padding:10px 14px;border-radius:10px;font-weight:600;font-size:14px;display:flex;gap:12px;align-items:center;max-width:calc(100% - 32px)}
.toast button{background:none;border:0;color:var(--accent);font-weight:700;filter:brightness(1.4)}
.menu{display:flex;flex-direction:column;gap:8px}
.menu .btn{justify-content:flex-start}
h2.sec{margin:6px 0 0;font:700 18px var(--f-display)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<header class="top">
  <h1 id="viewTitle">Collection</h1>
  <span class="sub num" id="viewSub"></span>
</header>
<main id="view"></main>

<nav class="tabs" aria-label="Sections">
  <button data-tab="coll"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="4" y="3" width="11" height="15" rx="2"/><path d="M8 21h10a2 2 0 0 0 2-2V7"/></svg>Collection</button>
  <button data-tab="scan"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 8V5a1 1 0 0 1 1-1h3M16 4h3a1 1 0 0 1 1 1v3M20 16v3a1 1 0 0 1-1 1h-3M8 20H5a1 1 0 0 1-1-1v-3"/><rect x="8.5" y="7" width="7" height="10" rx="1"/></svg>Scan</button>
  <button data-tab="search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="10.5" cy="10.5" r="6"/><path d="m15 15 5 5"/></svg>Search</button>
  <button data-tab="decks"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="6" width="9" height="13" rx="1.5" transform="rotate(-8 7 12)"/><rect x="11" y="5" width="9" height="13" rx="1.5" transform="rotate(8 15 11)"/></svg>Decks</button>
</nav>

<div id="sheetRoot"></div>
<div id="toastRoot"></div>
<input type="file" id="fileIn" hidden>

<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js"></script>
<script>
"use strict";
/* ---------- utilities ---------- */
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const sleep = ms => new Promise(r => setTimeout(r, ms));
const money = n => (n == null || isNaN(n)) ? "—" : "$" + Number(n).toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const uid = () => Math.random().toString(36).slice(2, 10);
function debounce(fn, ms) { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; }

/* ---------- storage ---------- */
const KEY = "deckhand.v1";
let S = { coll: {}, decks: {}, meta: {} };
try { const t = localStorage.getItem(KEY); if (t) S = Object.assign(S, JSON.parse(t)); } catch (e) {}
function save() {
  try { localStorage.setItem(KEY, JSON.stringify(S)); }
  catch (e) { toast("Couldn't save: phone storage is full or blocked. Export a backup from Collection."); }
}
try { navigator.storage && navigator.storage.persist && navigator.storage.persist(); } catch (e) {}

/* ---------- Scryfall ---------- */
const API = "https://api.scryfall.com";
let queue = Promise.resolve();
function sf(path, body) {
  const run = async () => {
    const r = await fetch(path.startsWith("http") ? path : API + path, {
      method: body ? "POST" : "GET",
      headers: body ? { "Accept": "application/json", "Content-Type": "application/json" } : { "Accept": "application/json" },
      body: body ? JSON.stringify(body) : undefined
    });
    const j = await r.json().catch(() => null);
    if (!r.ok) { const e = new Error((j && j.details) || ("Scryfall returned " + r.status)); e.status = r.status; e.data = j; throw e; }
    return j;
  };
  const p = queue.then(run);
  queue = p.catch(() => {}).then(() => sleep(110));
  return p;
}
const imgOf = (c, size = "small") => (c.image_uris && c.image_uris[size]) || (c.card_faces && c.card_faces[0] && c.card_faces[0].image_uris && c.card_faces[0].image_uris[size]) || "";
function slim(c) {
  const f = c.card_faces || [];
  return {
    id: c.id, oid: c.oracle_id || (f[0] && f[0].oracle_id) || "", name: c.name, set: c.set, setName: c.set_name,
    num: c.collector_number, rarity: c.rarity, type: c.type_line || (f[0] && f[0].type_line) || "",
    cmc: c.cmc || 0, mana: c.mana_cost != null ? c.mana_cost : f.map(x => x.mana_cost).filter(Boolean).join(" // "),
    colors: c.colors || (f[0] && f[0].colors) || [], img: imgOf(c, "small"), imgN: imgOf(c, "normal"),
    prices: c.prices || {}, finishes: c.finishes || ["nonfoil"], uri: c.scryfall_uri || ""
  };
}
const PKEY = { nonfoil: "usd", foil: "usd_foil", etched: "usd_etched" };
function priceOf(card, finish = "nonfoil") {
  const p = card.prices || {};
  const v = p[PKEY[finish]] ?? p.usd ?? p.usd_foil ?? p.usd_etched;
  return v == null ? null : parseFloat(v);
}
function pips(cost) {
  if (!cost) return "";
  return esc(cost).replace(/\{([^}]+)\}/g, (m, s) => {
    const cls = /^[WUBRGC]$/.test(s) ? s : (/^(\d+|X|Y|Z)$/.test(s) ? "N" : "H");
    return `<i class="pip p${cls}" title="${s}">${s.replace("/P", "ᵖ")}</i>`;
  });
}
async function cardsByIdentifiers(ids, onProgress) {
  const found = [], missing = [];
  for (let i = 0; i < ids.length; i += 75) {
    const chunk = ids.slice(i, i + 75);
    const r = await sf("/cards/collection", { identifiers: chunk });
    found.push(...(r.data || [])); missing.push(...(r.not_found || []));
    onProgress && onProgress(Math.min(i + 75, ids.length), ids.length);
  }
  return { found, missing };
}

/* ---------- collection helpers ---------- */
const ckey = (id, finish) => id + "|" + finish;
function addToColl(card, finish = "nonfoil", qty = 1) {
  const s = card.oid !== undefined && card.img !== undefined ? card : slim(card);
  if (!s.finishes.includes(finish)) finish = s.finishes[0] || "nonfoil";
  const k = ckey(s.id, finish);
  const cur = S.coll[k];
  if (cur) { cur.qty += qty; Object.assign(cur, { prices: s.prices }); }
  else S.coll[k] = Object.assign({}, s, { finish, qty, added: Date.now() });
  if (S.coll[k].qty <= 0) delete S.coll[k];
  save(); return k;
}
function ownedByName(name) { let n = 0; for (const k in S.coll) if (S.coll[k].name === name) n += S.coll[k].qty; return n; }
function collTotals() {
  let cards = 0, value = 0; const uniq = new Set();
  for (const k in S.coll) { const e = S.coll[k]; cards += e.qty; uniq.add(e.oid || e.name); value += (priceOf(e, e.finish) || 0) * e.qty; }
  return { cards, uniq: uniq.size, value };
}

/* ---------- toast ---------- */
let toastT;
function toast(msg, action) {
  clearTimeout(toastT);
  const root = $("#toastRoot");
  root.innerHTML = `<div class="toast" role="status"><span>${esc(msg)}</span>${action ? `<button id="toastAct">${esc(action.label)}</button>` : ""}</div>`;
  if (action) $("#toastAct").onclick = () => { root.innerHTML = ""; action.fn(); };
  toastT = setTimeout(() => root.innerHTML = "", action ? 6000 : 3200);
}

/* ---------- routing ---------- */
let tab = "coll", deckOpen = null;
document.querySelectorAll("nav.tabs button").forEach(b => b.onclick = () => go(b.dataset.tab));
function go(t, extra) {
  if (tab === "scan" && t !== "scan") stopCamera();
  tab = t; if (t === "decks") deckOpen = extra || null;
  document.querySelectorAll("nav.tabs button").forEach(b => b.setAttribute("aria-current", b.dataset.tab === t ? "page" : "false"));
  window.scrollTo(0, 0); render();
}
function setHead(title, sub = "") { $("#viewTitle").textContent = title; $("#viewSub").textContent = sub; }
function render() {
  if (tab === "coll") renderColl();
  else if (tab === "scan") renderScan();
  else if (tab === "search") renderSearch();
  else if (tab === "decks") deckOpen && S.decks[deckOpen] ? renderDeck(S.decks[deckOpen]) : renderDecks();
}

/* ================= COLLECTION ================= */
const cv = { q: "", sort: "value" };
function renderColl() {
  const t = collTotals();
  setHead("Collection", S.meta.pricedAt ? "Prices " + new Date(S.meta.pricedAt).toLocaleDateString() : "");
  const v = $("#view");
  if (!Object.keys(S.coll).length) {
    v.innerHTML = `<div class="empty"><h2>Your binder is empty</h2>
      <p>Scan cards with your camera, add them from Search, or bring over your ManaBox collection.</p>
      <div class="row wrap" style="justify-content:center">
        <button class="btn primary" id="eScan">Scan cards</button><button class="btn" id="eSearch">Search</button>
        <button class="btn" id="eImp">Import ManaBox CSV</button></div>

function drawCollList() {

  const val = e => (priceOf(e, e.finish) || 0) * e.qty;
  const cmp = { value: (a, b) => val(b[1]) - val(a[1]), name: (a, b) => a[1].name.localeCompare(b[1].name),
    set: (a, b) => a[1].set.localeCompare(b[1].set) || (parseInt(a[1].num) || 0) - (parseInt(b[1].num) || 0), recent: (a, b) => b[1].added - a[1].added }[cv.sort];
  rows.sort(cmp);
  const shown = rows.slice(0, 400);
  const el = $("#clist");
  if (!rows.length) { el.innerHTML = `<p class="muted">No cards match “${esc(cv.q)}”.</p>`; return; }
  el.innerHTML = `<div class="list">${shown.map(([k, e]) => `

      <button class="tap" data-open="${esc(k)}"><div class="name">${esc(e.name)}</div>
        <div class="meta"><span>${esc(e.set.toUpperCase())} #${esc(e.num)}</span>${e.finish !== "nonfoil" ? `<span class="chip foil">${e.finish}</span>` : ""}<span class="num">${money(priceOf(e, e.finish))} ea</span></div></button>
      <div class="right"><span class="price gold num">${money(val(e))}</span>

    ${rows.length > shown.length ? `<p class="small muted">Showing the top 400 of ${rows.length}. Use the filter to find others.</p>` : ""}`;
  el.onclick = ev => {
    const b = ev.target.closest("button"); if (!b) return;
    if (b.dataset.inc) { S.coll[b.dataset.inc].qty++; save(); renderColl(); }
    else if (b.dataset.dec) {
      const k = b.dataset.dec, e = S.coll[k];
      if (e.qty > 1) { e.qty--; save(); renderColl(); }
      else { const back = Object.assign({}, e); delete S.coll[k]; save(); renderColl(); toast("Removed " + e.name, { label: "Undo", fn: () => { S.coll[k] = back; save(); renderColl(); } }); }
    } else if (b.dataset.open) openCard(S.coll[b.dataset.open], S.coll[b.dataset.open].finish);
  };
}
async function refreshPrices() {
  const entries = Object.values(S.coll); if (!entries.length) return;
  const ids = [...new Set(entries.map(e => e.id))].map(id => ({ id }));

    for (const k in S.coll) { const c = map[S.coll[k].id]; if (c) { const s = slim(c); S.coll[k].prices = s.prices; S.coll[k].img = s.img || S.coll[k].img; S.coll[k].imgN = s.imgN || S.coll[k].imgN; } }

function pickFile(accept, fn) { const f = $("#fileIn"); f.accept = accept; f.value = ""; f.onchange = () => f.files[0] && fn(f.files[0]); f.click(); }
function download(name, text, type) {
  const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([text], { type })); a.download = name;
  document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
}
function ioSheet() {
  openSheet(`<h2>Import and export</h2>
    <p class="muted small">Your collection lives on this phone only. Export a backup now and then so you never lose it.</p>
    <div class="menu">

  $("#ioRest").onclick = () => pickFile(".json,application/json", async f => {

    catch (e) { $("#ioMsg").textContent = "That file isn't a Deckhand backup."; }
  });
  $("#ioCsv").onclick = () => {
    const head = "Name,Set code,Set name,Collector number,Foil,Rarity,Quantity,Scryfall ID,Price USD";
    const q = s => `"${String(s ?? "").replace(/"/g, '""')}"`;
    const lines = Object.values(S.coll).map(e => [q(e.name), q(e.set), q(e.setName), q(e.num), e.finish === "nonfoil" ? "normal" : e.finish, e.rarity, e.qty, e.id, priceOf(e, e.finish) ?? ""].join(","));
    download(`deckhand-collection-${stamp}.csv`, [head, ...lines].join("\n"), "text/csv");

function parseCSV(text) {
  const rows = []; let row = [], f = "", i = 0, inQ = false;
  text = text.replace(/^﻿/, "");
  while (i < text.length) {
    const c = text[i];
    if (inQ) { if (c === '"') { if (text[i + 1] === '"') { f += '"'; i++; } else inQ = false; } else f += c; }
    else if (c === '"') inQ = true;
    else if (c === ",") { row.push(f); f = ""; }
    else if (c === "\n" || c === "\r") { if (c === "\r" && text[i + 1] === "\n") i++; row.push(f); rows.push(row); row = []; f = ""; }
    else f += c;
    i++;
  }
  if (f || row.length) { row.push(f); rows.push(row); }
  return rows.filter(r => r.some(x => x.trim()));
}
async function importCSV(file) {
  const rows = parseCSV(await file.text());
  if (rows.length < 2) { toast("That CSV looks empty."); return; }
  const h = rows[0].map(x => x.trim().toLowerCase());
  const col = re => h.findIndex(x => re.test(x));
  const iId = col(/scryfall/), iQty = col(/^(quantity|qty|count)$/), iFoil = col(/foil|finish|printing/), iSet = col(/^(set code|set|edition code)$/), iNum = col(/collector/), iName = col(/^(name|card name|card)$/);
  if (iId < 0 && iName < 0) { toast("Couldn't find a Name or Scryfall ID column in that CSV."); return; }
  const want = rows.slice(1).map(r => {
    const fv = iFoil >= 0 ? (r[iFoil] || "").toLowerCase() : "";
    const finish = fv.includes("etched") ? "etched" : (fv === "foil" || fv === "true" || fv === "yes" || fv === "1") ? "foil" : "nonfoil";
    const qty = Math.max(1, parseInt(iQty >= 0 ? r[iQty] : "1") || 1);
    let ident;
    if (iId >= 0 && /^[0-9a-f-]{36}$/i.test((r[iId] || "").trim())) ident = { id: r[iId].trim() };
    else if (iSet >= 0 && iNum >= 0 && r[iSet] && r[iNum]) ident = { set: r[iSet].trim().toLowerCase(), collector_number: r[iNum].trim() };
    else if (iName >= 0 && r[iName]) ident = { name: r[iName].trim() };
    return ident ? { ident, finish, qty } : null;
  }).filter(Boolean);
  toast(`Importing ${want.length} rows…`);
  try {
    const found = [], missing = [];
    for (let i = 0; i < want.length; i += 75) {
      const chunk = want.slice(i, i + 75);
      const r = await sf("/cards/collection", { identifiers: chunk.map(w => w.ident) });
      const data = r.data || [];
      const match = w => data.find(c => w.ident.id ? c.id === w.ident.id : w.ident.collector_number ? (c.set === w.ident.set && c.collector_number === w.ident.collector_number) : c.name.toLowerCase() === w.ident.name.toLowerCase() || c.name.toLowerCase().startsWith(w.ident.name.toLowerCase() + " //"));
      for (const w of chunk) { const c = match(w); if (c) found.push([c, w]); else missing.push(w); }
      toast(`Importing… ${Math.min(i + 75, want.length)}/${want.length}`);
    }
    for (const [c, w] of found) addToColl(slim(c), w.finish, w.qty);
    S.meta.pricedAt = Date.now(); save(); closeSheet(); go("coll");
    toast(`Imported ${found.reduce((a, [, w]) => a + w.qty, 0)} cards` + (missing.length ? `, ${missing.length} rows not found` : ""));
  } catch (e) { toast("Import stopped: " + e.message); }
}

function attachAutocomplete(inp, ul, onPick) {
  const look = debounce(async () => {
    const q = inp.value.trim();
    if (q.length < 2 || /[:<>=!"]/.test(q)) { ul.hidden = true; return; }
    try {
      const r = await sf("/cards/autocomplete?q=" + encodeURIComponent(q));
      if (inp.value.trim() !== q) return;
      const names = (r.data || []).slice(0, 8);
      ul.innerHTML = names.map(n => `<li><button type="button" data-n="${esc(n)}">${esc(n)}</button></li>`).join("");
      ul.hidden = !names.length;
    } catch (e) { ul.hidden = true; }
  }, 220);
  inp.addEventListener("input", look);
  inp.addEventListener("blur", () => setTimeout(() => ul.hidden = true, 200));
  ul.onclick = e => { const b = e.target.closest("button"); if (b) { ul.hidden = true; onPick(b.dataset.n); } };
}
async function runSearch(q) {
  q = q.trim(); if (!q) return;
  Object.assign(sv, { q, results: [], next: null, total: 0, busy: true, err: "" }); drawResults();
  try {
    const r = await sf(`/cards/search?q=${encodeURIComponent(q)}&unique=${sv.prints ? "prints" : "cards"}&order=${sv.prints ? "released" : "name"}`);
    Object.assign(sv, { results: r.data || [], next: r.has_more ? r.next_page : null, total: r.total_cards || 0 });
  } catch (e) { sv.err = e.status === 404 ? `No cards match “${q}”.` : e.message; }
  sv.busy = false; if (tab === "search") { setHead("Search", sv.total ? sv.total.toLocaleString() + " results" : ""); drawResults(); }
}
function drawResults() {
  const el = $("#sres"); if (!el) return;
  if (sv.busy && !sv.results.length) { el.innerHTML = `<p class="muted">Searching…</p>`; return; }
  if (sv.err) { el.innerHTML = `<p class="muted">${esc(sv.err)}</p>`; return; }
  if (!sv.results.length) { el.innerHTML = `<p class="small muted">Type a name, or use Scryfall syntax like <b>t:dragon c:r</b> or <b>o:flying pow>=4</b>. Tap a card to see prices and add it.</p>`; return; }
  el.innerHTML = `<div class="grid">${sv.results.map((c, i) => `<button data-i="${i}" aria-label="${esc(c.name)}">
      ${imgOf(c) ? `<img loading="lazy" src="${esc(imgOf(c, "normal"))}" alt="">` : `<span class="fallback">${esc(c.name)}</span>`}
      ${priceOf(c) != null ? `<span class="pr num">${money(priceOf(c))}</span>` : ""}</button>`).join("")}</div>
    ${sv.next ? `<p><button class="btn" id="smore" ${sv.busy ? "disabled" : ""}>${sv.busy ? "Loading…" : "Load more"}</button></p>` : ""}`;
  el.querySelector(".grid").onclick = e => { const b = e.target.closest("button"); if (b) openCard(sv.results[+b.dataset.i]); };
  const m = $("#smore"); if (m) m.onclick = async () => {
    sv.busy = true; drawResults();
    try { const r = await sf(sv.next); sv.results.push(...(r.data || [])); sv.next = r.has_more ? r.next_page : null; } catch (e) { toast(e.message); }
    sv.busy = false; drawResults();
  };
}

        <textarea id="pl" placeholder="4 Lightning Bolt&#10;2 Counterspell (MH2) 267&#10;1x Sol Ring&#10;&#10;Sideboard&#10;2 Pyroblast"></textarea>
        <button class="btn primary" id="plGo">Add these cards</button><div class="status small" id="plMsg"></div></div>
      <div class="card-box"><span class="label">Export</span><textarea id="ex" readonly>${esc(deckText(d))}</textarea><button class="btn" id="cp">Copy list</button></div>
      <div class="card-box"><span class="label">Missing cards</span><button class="btn" id="miss">Copy the cards I don't own</button></div>
      <div class="card-box"><button class="btn danger" id="del">Delete deck</button>
        <div class="row" id="delConfirm" hidden><span class="grow small">Delete “${esc(d.name)}” for good?</span><button class="btn sm danger" id="delYes">Delete</button><button class="btn sm" id="delNo">Keep</button></div></div>
    </div>`, () => render());
  $("#rnGo").onclick = () => { const v = $("#rn").value.trim(); if (v) { d.name = v; save(); toast("Renamed"); } };
  const copy = async (text, el) => { try { await navigator.clipboard.writeText(text); toast("Copied"); } catch (e) { if (el) { el.select(); } toast("Select the text and copy it"); } };
  $("#cp").onclick = () => copy($("#ex").value, $("#ex"));
  $("#miss").onclick = () => {
    const need = {}; for (const c of Object.values(d.cards)) need[c.name] = (need[c.name] || 0) + c.qty;
    const lines = Object.entries(need).map(([n, q]) => [n, q - ownedByName(n)]).filter(([, q]) => q > 0).map(([n, q]) => `${q} ${n}`);
    lines.length ? copy(lines.join("\n")) : toast("You own every card in this deck");
  };
  $("#del").onclick = () => { $("#delConfirm").hidden = false; };
  $("#delNo").onclick = () => { $("#delConfirm").hidden = true; };
  $("#delYes").onclick = () => { delete S.decks[d.id]; save(); deckOpen = null; closeSheet(); toast("Deck deleted"); };
  $("#plGo").onclick = async () => {
    const msg = $("#plMsg"), lines = $("#pl").value.split(/\n/); let side = false; const want = [];
    for (let raw of lines) {
      const l = raw.trim(); if (!l) continue;
      if (/^(sideboard|side|sb:?)$/i.test(l)) { side = true; continue; }
      if (/^(deck|main|mainboard|commander|companion)$/i.test(l)) continue;
      let m = l.replace(/^SB:\s*/i, () => { side = true; return ""; }).match(/^(\d+)\s*x?\s+(.+?)(?:\s+\(([A-Za-z0-9]{2,6})\)\s*([\w★-]+)?)?(?:\s+\*F\*)?\s*$/);
      if (!m) m = [null, "1", l.replace(/\s+\(.*$/, "")];
      const qty = parseInt(m[1]) || 1, name = m[2].trim(), set = m[3], num = m[4];
      want.push({ qty, side, ident: set && num ? { set: set.toLowerCase(), collector_number: num } : { name: name.split(" // ")[0] }, name });
    }
    if (!want.length) { msg.textContent = "Paste one card per line, like “4 Lightning Bolt”."; return; }
    msg.textContent = `Looking up ${want.length} cards…`;
    try {
      const missing = [];
      for (let i = 0; i < want.length; i += 75) {
        const chunk = want.slice(i, i + 75), r = await sf("/cards/collection", { identifiers: chunk.map(w => w.ident) }), data = r.data || [];
        for (const w of chunk) {
          const c = data.find(c => w.ident.collector_number ? c.set === w.ident.set && c.collector_number === w.ident.collector_number : c.name.toLowerCase() === w.ident.name.toLowerCase() || c.name.toLowerCase().startsWith(w.ident.name.toLowerCase() + " //"));
          if (c) addToDeck(d, c, w.qty, w.side); else missing.push(w.name);
        }
      }
      msg.textContent = missing.length ? `Added. Couldn't find: ${missing.join(", ")}` : "All cards added.";
      $("#ex").value = deckText(d);
    } catch (e) { msg.textContent = "Lookup failed: " + e.message; }
  };
}

/* ---------- start ---------- */
go("coll");
</script>
</body>
</html>
