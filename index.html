<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#16202b">
<title>Deckhand</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192-v2.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon-v2.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Deckhand">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo+Narrow:wght@500;600;700&family=Source+Sans+3:wght@400;600;700&display=swap">
<style>
/* Layout: one-screen phone app — sticky header, scrolling view, fixed bottom tab bar; sheets slide up from the bottom. */
:root{
  --bg:#eef1f4; --surface:#ffffff; --sunk:#e3e8ee; --ink:#16202b; --muted:#5a6878; --line:#d3dae2;
  --accent:#1d5f8f; --accent-ink:#ffffff; --gold:#9a6a12; --danger:#b23a2a; --ok:#2c7a4b;
  --mW:#efe5bd; --mU:#2f7fc1; --mB:#3b3340; --mR:#d3452f; --mG:#2f8a4f; --mC:#a7acb3; --mN:#c9ced5;
  --f-display:"Archivo Narrow","Arial Narrow",Arial,sans-serif;
  --f-body:"Source Sans 3",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --nav-h:62px;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0f141a; --surface:#18202a; --sunk:#121920; --ink:#e5eaf0; --muted:#93a1b1; --line:#2a3543;
  --accent:#62a9dc; --accent-ink:#0b1620; --gold:#e1b14f; --danger:#ef7462; --ok:#5cc489;
  --mN:#4a5563; color-scheme:dark;
}}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 var(--f-body);-webkit-tap-highlight-color:transparent}
img{max-width:100%}
[hidden]{display:none!important}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}

header.top{position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:1px solid var(--line);
  padding:calc(env(safe-area-inset-top,0px) + 10px) max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));
  display:flex;align-items:center;justify-content:space-between;gap:12px}
header.top .brand{display:flex;align-items:center;gap:9px;min-width:0}
header.top .logo{width:30px;height:30px;border-radius:8px;background:#fff;object-fit:contain;padding:1px;flex:none;box-shadow:0 0 0 1px var(--line)}
#splash{position:fixed;inset:0;z-index:100;background:#0f141b;display:flex;align-items:center;justify-content:center;transition:opacity .35s ease}
#splash img{width:min(92vw,900px);height:auto;max-height:80vh;object-fit:contain;border-radius:14px}
#splash.out{opacity:0;pointer-events:none}
header.top h1{margin:0;font:700 22px/1.1 var(--f-display);letter-spacing:.02em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
header.top .sub{font-size:13px;color:var(--muted);white-space:nowrap}
header.top .hright{display:flex;align-items:center;gap:8px;min-width:0}
.syncpill{border:1px solid var(--line);background:var(--surface);color:var(--muted);border-radius:999px;padding:3px 10px;font:600 12px/1.4 var(--f-body);white-space:nowrap;cursor:pointer}
.syncpill.ok{color:var(--ok)}.syncpill.warn{color:var(--danger);border-color:var(--danger)}.syncpill.busy{color:var(--accent)}
main{padding:14px max(16px,env(safe-area-inset-right,0px)) calc(var(--nav-h) + env(safe-area-inset-bottom,0px) + 24px) max(16px,env(safe-area-inset-left,0px));max-width:900px;margin:0 auto}

nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);
  display:grid;grid-template-columns:repeat(6,1fr);padding:0 env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)}
nav.tabs button{background:none;border:0;height:var(--nav-h);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  font:600 11px var(--f-display);letter-spacing:.05em;text-transform:uppercase;color:var(--muted);min-width:0}
@media (max-width:420px){nav.tabs button{font-size:10px;letter-spacing:.02em}}
nav.tabs button svg{width:24px;height:24px}
nav.tabs button[aria-current="page"]{color:var(--accent)}

.row{display:flex;gap:8px;align-items:center}
.wrap{flex-wrap:wrap}
.grow{flex:1;min-width:0}
.stack{display:flex;flex-direction:column;gap:12px}
.label{font:600 12px var(--f-display);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}
.small{font-size:13px}
input[type=text],input[type=search],input[type=number],select,textarea{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-height:44px;width:100%}
textarea{min-height:140px;resize:vertical}
select{width:auto;max-width:100%}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;min-height:44px;padding:0 14px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap;text-decoration:none}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{color:var(--danger)}
.btn.ghost{background:none;border-color:transparent}
.btn.sm{min-height:34px;padding:0 10px;font-size:14px;border-radius:8px}
.btn:disabled{opacity:.5;cursor:default}
.chip{display:inline-flex;align-items:center;gap:4px;font:600 11px var(--f-display);letter-spacing:.06em;text-transform:uppercase;padding:2px 7px;border-radius:999px;border:1px solid var(--line);color:var(--muted);white-space:nowrap;background:none}
.chip.foil{border-color:var(--gold);color:var(--gold)}
.chip.warn{border-color:var(--danger);color:var(--danger)}
.chip.ok{border-color:var(--ok);color:var(--ok)}
.chip.acc{border-color:var(--accent);color:var(--accent)}
.chip.tg-staple{border-color:var(--accent);color:var(--accent);font-weight:600} .chip.tg-sleeve{border-color:var(--gold);color:var(--gold);font-weight:600} .chip.tg-bulk{color:var(--muted);border-style:dashed}
.grid .tg{position:absolute;left:4px;top:4px;background:rgba(10,15,20,.78);color:#fff;font:600 10px var(--f-display);padding:1px 5px;border-radius:4px;letter-spacing:.02em}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:14px}
.chips button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.scrollx{overflow-x:auto;flex-wrap:nowrap;padding-bottom:2px}
.scrollx button{flex:0 0 auto}

.pip{display:inline-grid;place-items:center;width:18px;height:18px;border-radius:50%;font:700 10px/1 var(--f-display);font-style:normal;background:var(--mN);color:#111;margin-right:1px;vertical-align:-3px}
.pip.pW{background:var(--mW)}.pip.pU{background:var(--mU);color:#fff}.pip.pB{background:var(--mB);color:#fff}
.pip.pR{background:var(--mR);color:#fff}.pip.pG{background:var(--mG);color:#fff}.pip.pC{background:var(--mC)}
.pip.pH{width:auto;padding:0 4px;border-radius:9px}

.summary{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.summary div{background:var(--surface);padding:10px 12px;min-width:0}
.summary b{display:block;font:700 22px/1.1 var(--f-display);overflow:hidden;text-overflow:ellipsis}
.gold{color:var(--gold)}
.up{color:var(--ok)} .down{color:var(--danger)}

.list{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.item{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px 10px;border-top:1px solid var(--line)}
#clist .item,#dl .item{content-visibility:auto;contain-intrinsic-size:auto 66px}      /* rows off screen aren't laid out until scrolled to: big collections stay quick */
.item:first-child{border-top:0}
.item img{width:44px;height:61px;object-fit:cover;border-radius:4px;background:var(--sunk);display:block}
.item .name{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .meta{font-size:13px;color:var(--muted);display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.item .right{text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.item.flagged{box-shadow:inset 3px 0 0 var(--danger)}
.item .check{width:44px;height:44px;border-radius:8px;border:2px solid var(--line);display:grid;place-items:center;font-weight:700;color:var(--accent-ink);font-size:20px}
.item.picked{background:color-mix(in srgb, var(--accent) 10%, var(--surface))}
.item.picked .check{background:var(--accent);border-color:var(--accent)}
.selbar{position:sticky;top:calc(env(safe-area-inset-top,0px) + 52px);z-index:5;margin-bottom:8px;border-color:var(--accent)}
.chip.deck{border-color:var(--accent);color:var(--accent);background:none}
.marks{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.marks button{border:0;background:var(--surface);padding:6px 8px;font-size:13px;font-weight:600;color:var(--muted)}
.marks button+button{border-left:1px solid var(--line)}
.marks button.have[aria-pressed="true"]{background:var(--ok);color:#fff}
.marks button.want[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.marks button.need[aria-pressed="true"]{background:var(--danger);color:#fff}
.bar{height:8px;border-radius:4px;background:var(--sunk);overflow:hidden}
.bar div{height:100%;background:var(--ok)}
button.chip.deck{cursor:pointer}
.own{border-top:1px solid var(--line);padding-top:8px}
.own:first-of-type{border-top:0}
.editbox{display:flex;flex-direction:column;gap:8px;background:var(--sunk);border-radius:10px;padding:10px;margin-top:8px}
.tap{background:none;border:0;padding:0;text-align:left;width:100%;min-width:0}
.stepper{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.stepper button{border:0;background:var(--sunk);width:30px;height:30px;font-weight:700}
.stepper span{min-width:28px;text-align:center;font-weight:600}
.price{font-weight:600}
.item .scanned{color:var(--accent);white-space:nowrap}
.group-h{padding:8px 10px;background:var(--sunk);font:600 12px var(--f-display);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);display:flex;justify-content:space-between}
table.cmp{width:100%;border-collapse:collapse;font-size:14px} table.cmp th,table.cmp td{padding:5px 6px;border-bottom:1px solid var(--line);text-align:right;vertical-align:middle} table.cmp th:first-child,table.cmp td:first-child{text-align:left;color:var(--muted)} table.cmp th{font-weight:700;max-width:30vw;overflow-wrap:anywhere}
table.cmp .cmph td{color:var(--ink);font:600 12px var(--f-display);letter-spacing:.08em;text-transform:uppercase;background:var(--sunk);text-align:left} table.cmp td.cmpw{font-weight:800;color:var(--accent)}
.cmpcurve{display:flex;align-items:flex-end;gap:2px;height:34px;width:86px;margin-left:auto}.cmpcurve span{flex:1;background:var(--accent);opacity:.75;border-radius:2px 2px 0 0;min-height:1px}
.phmv{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}.phmv>div{display:flex;flex-direction:column;background:var(--sunk);border-radius:8px;padding:6px 8px}
#gf table.odds{font-size:12.5px} #gf table.odds td:first-child,#gf table.odds th:first-child{white-space:nowrap;text-align:left;padding-right:8px} #gf .summary{grid-template-columns:repeat(auto-fit,minmax(130px,1fr))}
button.group-h{width:100%;border:0;border-top:1px solid var(--line);cursor:pointer;align-items:center;text-align:left;min-height:40px}
button.group-h:hover{color:var(--ink)}
button.group-h .chev{display:inline-block;width:1em;transition:transform .15s} button.group-h[aria-expanded="false"] .chev{transform:rotate(-90deg)}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:8px}
.grid button{border:0;padding:0;border-radius:6px;overflow:hidden;aspect-ratio:63/88;background:var(--sunk);position:relative}
.grid img{width:100%;height:100%;object-fit:cover;display:block}
.grid .fallback{position:absolute;inset:0;display:grid;place-items:center;padding:6px;font-size:12px;text-align:center}
.grid .pr{position:absolute;right:4px;bottom:4px;background:rgba(10,15,20,.78);color:#fff;font:600 11px var(--f-display);padding:1px 5px;border-radius:4px}
.grid .tile{display:flex;flex-direction:column;gap:3px;min-width:0}
.grid .cap{font-size:11px;color:var(--muted);text-align:center;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.fgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.fgrid label{display:flex;flex-direction:column;gap:4px;min-width:0}
.fgrid select{width:100%}
.ptable{border-collapse:collapse;font-size:13px;width:100%;min-width:420px}
.ptable th{text-align:left;font:600 11px var(--f-display);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:4px 6px;border-bottom:1px solid var(--line)}
.ptable td{padding:5px 6px;border-bottom:1px solid var(--line);white-space:nowrap;max-width:180px;overflow:hidden;text-overflow:ellipsis}
details.box summary{list-style:none}
details.box summary::-webkit-details-marker{display:none}
details.box summary::after{content:" ▾"}
.cpick{display:inline-flex;gap:6px}
.cpick button{width:40px;height:40px;border-radius:50%;border:2px solid transparent;background:var(--sunk);display:grid;place-items:center;padding:0;opacity:.55}
.cpick button[aria-pressed="true"]{opacity:1;border-color:var(--accent);background:var(--surface)}
.cpick .pip{width:24px;height:24px;font-size:12px;margin:0;vertical-align:0}
.btn.on{border-color:var(--accent);color:var(--accent)}

.empty{background:var(--surface);border:1px dashed var(--line);border-radius:12px;padding:24px 18px;text-align:center;display:flex;flex-direction:column;gap:10px;align-items:center}
.empty h2{margin:0;font:700 20px var(--f-display)}
.empty p{margin:0;color:var(--muted);max-width:34ch}

.cam{position:relative;background:#000;border-radius:14px;overflow:hidden;height:min(58vh,540px)}
.cam video{width:100%;height:100%;object-fit:cover;display:block}
.cam .frame{position:absolute;border:2px dashed rgba(255,255,255,.8);border-radius:10px;box-shadow:0 0 0 2000px rgba(0,0,0,.38);pointer-events:none}
.cam .band{position:absolute;left:3%;right:3%;border:1.5px dashed #ffd76a;border-radius:4px}
.cam .band.name{top:3%;height:7.5%;right:20%}
.cam .band.info{bottom:2.5%;height:8%;right:52%}
.cam .hint{position:absolute;left:0;right:0;top:10px;text-align:left;color:#fff;font-size:14px;font-weight:600;text-shadow:0 1px 3px #000;padding:0 104px 0 12px;min-height:20px}
.cam .frame{transition:left .12s linear,top .12s linear,width .12s linear,height .12s linear,transform .12s linear,border-color .15s}
.cam .frame.locked{border-style:solid;border-color:#fff}
.cam .frame.locked .band{opacity:.45}
.cam .frame.steady{border-color:#ffd76a}
.cam .frame.good{border-color:#5cc489;border-width:3px}
.cam .fprog{position:absolute;left:8%;right:8%;bottom:-10px;height:5px;background:#ffd76a;border-radius:3px;transform:scaleX(0);transform-origin:left}
.cam .frame.good .fprog{background:#5cc489}
.cam .pill{position:absolute;top:8px;right:10px;border:0;border-radius:999px;padding:7px 12px;font:700 12px var(--f-display);letter-spacing:.06em;text-transform:uppercase;background:rgba(0,0,0,.6);color:#fff}
.cam .pill[aria-pressed="true"]{background:#5cc489;color:#06210f}
.cam .sbar{position:absolute;left:12%;right:12%;bottom:96px;background:rgba(0,0,0,.72);border-radius:10px;padding:8px 10px;display:flex;flex-direction:column;gap:5px;color:#fff;font-size:13px;font-weight:600}
.cam .strack{height:8px;border-radius:4px;background:rgba(255,255,255,.22);overflow:hidden}
.cam .sfill{height:100%;width:0;background:#62a9dc;border-radius:4px;transition:width .18s linear}
.cam .sbar.ok .sfill{background:#5cc489}
.cam .sbar.fail .sfill{background:#ef7462}
.cam .ctrl{position:absolute;left:0;right:0;bottom:12px;display:flex;justify-content:center;align-items:center;gap:22px}
.shutter{width:70px;height:70px;border-radius:50%;border:4px solid #fff;background:rgba(255,255,255,.25)}
.shutter:active{background:rgba(255,255,255,.6)}
.foiltog{flex-direction:column;font-size:16px;line-height:1;gap:1px}.foiltog span{font-size:9px;font-weight:700;letter-spacing:.03em;text-transform:uppercase}
.foiltog[aria-pressed="true"]{background:linear-gradient(135deg,#f5d77a,#9ad0f5,#e6a2e8);color:#16202b}
.round{width:46px;height:46px;border-radius:50%;border:0;background:rgba(0,0,0,.55);color:#fff;display:grid;place-items:center}
.round[aria-pressed="true"]{background:#ffd76a;color:#000}
.status{min-height:22px;font-size:14px;color:var(--muted)}
.match{display:grid;grid-template-columns:96px minmax(0,1fr);gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px}
.match img{width:96px;border-radius:6px;display:block}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:var(--surface);padding:6px 10px;font-size:14px;font-weight:600}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.toggle{display:flex;align-items:center;gap:8px;font-size:14px}
.toggle input{width:20px;height:20px;accent-color:var(--accent)}

.scrim{position:fixed;inset:0;background:rgba(5,10,15,.55);z-index:40}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;background:var(--bg);border-radius:16px 16px 0 0;max-height:92vh;overflow:auto;
  padding:8px max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));max-width:720px;margin:0 auto}
.sheet .grab{width:44px;height:5px;border-radius:3px;background:var(--line);margin:4px auto 10px}
.sheet h2{margin:0;font:700 24px/1.15 var(--f-display);text-wrap:balance}
.baltable{padding:6px 10px}.balrow{display:grid;grid-template-columns:minmax(0,1fr) 26px 52px 50px 50px;align-items:center;gap:6px;padding:7px 0;border-top:1px solid var(--line)}
.balrow.head{border-top:0;padding-top:2px}.balrow .bn{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.balrow .btn{padding:4px 10px}
#pv{position:fixed;z-index:1000;width:250px;aspect-ratio:63/88;border-radius:12px;box-shadow:0 10px 30px rgba(0,0,0,.35);pointer-events:none;background:var(--sunk)}
.addpr{display:flex;gap:10px;align-items:center}.addpr img{width:40px;aspect-ratio:63/88;object-fit:cover;border-radius:4px;background:var(--sunk);flex:none}.addpr>div{flex:1}
.mvrow{display:grid;grid-template-columns:minmax(0,1fr) auto 112px;gap:8px;align-items:center;width:100%;text-align:left;padding:5px 0;border:0;border-top:1px solid var(--line);background:none;font:inherit;color:inherit;cursor:pointer}
.mvrow .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.mvrow>span:last-child{text-align:right}.mvhead{margin-top:4px}
#mvRar button{font-size:13px}#mvRar .rar-mythic{border-color:#c4622d}#mvRar .rar-rare{border-color:#b8962e}#mvRar .rar-uncommon{border-color:#7d8a96}
ol.welcome{text-align:left;max-width:460px;margin:8px auto 14px;padding-left:20px;display:flex;flex-direction:column;gap:6px}
.seg.wide{display:flex;overflow-x:auto;scrollbar-width:none}
.swap{border-top:1px solid var(--line);padding:10px 0;display:flex;flex-direction:column;gap:6px}.swap.over{opacity:.6}
.swapcards{display:grid;grid-template-columns:1fr 18px 1fr;gap:6px;align-items:center}.swapcards .arrow{text-align:center;color:var(--muted)}
.sc{display:flex;gap:6px;align-items:flex-start;text-align:left;border:0;background:none;padding:0;font:inherit;color:inherit;cursor:pointer;min-width:0}.sc img{width:44px;aspect-ratio:63/88;object-fit:cover;border-radius:4px;flex:none;background:var(--sunk)}.sc span{min-width:0;overflow-wrap:anywhere}
.cmpgrid{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(150px,1fr);gap:8px;overflow-x:auto;padding-bottom:4px}.cmpcol{display:flex;flex-direction:column;gap:3px;min-width:0}.cmpcol img{width:100%;border-radius:8px;aspect-ratio:63/88;object-fit:cover;background:var(--sunk)}

<script>
"use strict";
/* ---------- utilities ---------- */
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const sleep = ms => new Promise(r => setTimeout(r, ms));
const MONEY_FMT = new Intl.NumberFormat(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 });      // made once: toLocaleString with options rebuilds it on every call
const money = n => (n == null || isNaN(n)) ? "—" : "$" + MONEY_FMT.format(Number(n));
const signed = n => (n > 0 ? "+" : n < 0 ? "−" : "") + money(Math.abs(n));
const uid = () => Math.random().toString(36).slice(2, 10);
const today = () => Math.floor(Date.now() / 864e5);
const dayStr = d => new Date(d * 864e5 + 12 * 36e5).toLocaleDateString(undefined, { month: "short", day: "numeric" });
const sameDay = (a, b) => a.getFullYear() === b.getFullYear() && a.getMonth() === b.getMonth() && a.getDate() === b.getDate();
const clock = t => new Date(t).toLocaleTimeString(undefined, { hour: "numeric", minute: "2-digit" });
function dayLabel(t) {
  const d = new Date(t), now = new Date(), y = new Date(now); y.setDate(now.getDate() - 1);
  if (sameDay(d, now)) return "Today";
  if (sameDay(d, y)) return "Yesterday";
  return d.toLocaleDateString(undefined, d.getFullYear() === now.getFullYear() ? { weekday: "short", month: "short", day: "numeric" } : { month: "short", day: "numeric", year: "numeric" });
}
const scanWhen = t => { const l = dayLabel(t); return (l === "Today" || l === "Yesterday" ? l.toLowerCase() : l) + " " + clock(t); };
function debounce(fn, ms) { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; }
const norm = s => s.normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase();

/* ---------- storage & migration ---------- */

try { const t = localStorage.getItem(KEY); if (t) S = JSON.parse(t); } catch (e) {}

  S.coll = S.coll || {}; S.decks = S.decks || {}; S.meta = S.meta || {}; if (!S.lists || typeof S.lists !== "object") S.lists = {}; if (!S.spec || typeof S.spec !== "object") S.spec = {};

    main: { id: "main", name: "Collection" }, trade: { id: "trade", name: "Trade binder" }, wish: { id: "wish", name: "Wishlist", wish: true } };
  S.settings = S.settings || {}; S.alerts = S.alerts || {}; for (const k in S.alerts) if (!S.alerts[k] || typeof S.alerts[k] !== "object") delete S.alerts[k]; else normAlert(S.alerts[k]); S.ph = S.ph || {}; S.hist = S.hist || []; S.trade = S.trade || { give: [], get: [] }; if (!Array.isArray(S.trade.sell)) S.trade.sell = [];

    const e = S.coll[k]; if (!e || !e.id) continue;
    if (!e.binder || !S.binders[e.binder]) e.binder = ownBinder();
    if (e.cond && !CONDS.some(c => c[0] === e.cond)) e.cond = "NM";
    if (e.paid != null && !(typeof e.paid === "number" && isFinite(e.paid) && e.paid >= 0)) delete e.paid;

  for (const k in S.coll) fixFin(S.coll[k]);
  for (const d of Object.values(S.decks || {})) for (const c of Object.values(d.cards || {})) fixFin(c);

const ckey = (id, finish, binder, cond) => id + "|" + finish + "|" + binder + (cond && cond !== "NM" ? "|" + cond : "");
const CONDS = [["NM", "Near Mint"], ["LP", "Lightly Played"], ["MP", "Moderately Played"], ["HP", "Heavily Played"], ["DMG", "Damaged"]];
// condition words used by ManaBox, Moxfield, TCGplayer, Deckbox and others
function condOf(v) {
  const t = String(v || "").toLowerCase().replace(/[_-]+/g, " ").trim();
  if (!t || /^(m|mint|nm|near mint|nm m|near mint or better)$/.test(t)) return "NM";
  if (/^(lp|sp|ex|excellent|light(ly)? played|slightly played)$/.test(t)) return "LP";
  if (/^(mp|gd|good|played|moderately played)$/.test(t)) return "MP";
  if (/^(hp|pl|poor|heavily played)$/.test(t)) return "HP";

/* Saving: the phone's IndexedDB database (room for very large collections). Browser localStorage

const idb = { p: null, ok: typeof indexedDB !== "undefined" };
function idbOpen() {
  if (!idb.p) idb.p = new Promise((res, rej) => {
    const r = indexedDB.open("deckhand", 1);

    r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); r.onblocked = () => rej(new Error("blocked"));

async function runSearch(q) {
  q = (q || "").trim();
  const fq = filterQuery(sv.f), full = [q, fq].filter(Boolean).join(" ");

  const [order, dir] = SORTS[sv.sort] || SORTS.newest;
  const hadResults = !!sv.results.length;
  Object.assign(sv, { q, results: [], next: null, total: 0, busy: true, err: "", ran: full });
  if (!hadResults && tab === "search") { const sx = $("#sx"); if (sx) sx.remove(); }
  drawResults();
  try {
    const r = await sf(`/cards/search?q=${encodeURIComponent(full)}&unique=${sv.prints ? "prints" : "cards"}&order=${order}&dir=${dir}`);
    if (sv.ran !== full) return;
    Object.assign(sv, { results: r.data || [], next: r.has_more ? r.next_page : null, total: r.total_cards || 0 });
  } catch (e) { if (sv.ran !== full) return; sv.err = e.status === 404 ? (fq ? "No cards match that search and these filters. Try loosening a filter." : `No cards match “${q}”.`) : e.message; }
  sv.busy = false; if (tab === "search") { setHead("Search", sv.total ? sv.total.toLocaleString() + " results" : ""); drawResults(); }
}
function drawResults() {
  const el = $("#sres"); if (!el) return;
  if (sv.busy && !sv.results.length) { el.innerHTML = `<p class="muted">Searching…</p>`; return; }
  if (sv.err) { el.innerHTML = `<p class="muted">${esc(sv.err)}</p>`; return; }
  if (!sv.results.length) { el.innerHTML = `<p class="small muted">Start typing and pick a name to see every printing, newest first. Or open Filters to browse by color, type, rarity, format, mana value, price or set. Scryfall syntax like <b>t:dragon o:flying</b> works too.</p>`; return; }
  const picked = sv.keepQ && sv.q === sv.keepQ ? sv.keepQ.replace(/^!"|"$/g, "") : "";
  el.innerHTML = `${picked ? `<p class="small muted" style="margin:0 0 6px">Printings of <b>${esc(picked)}</b></p>` : ""}<div class="grid">${sv.results.map((c, i) => `<div class="tile"><button data-i="${i}" aria-label="${esc(c.name)}, ${esc(c.set_name)}">
      ${imgOf(c) ? `<img loading="lazy" src="${esc(imgOf(c, "normal"))}" alt="">` : `<span class="fallback">${esc(c.name)}</span>`}
      ${priceOf(c) != null ? `<span class="pr num">${money(priceOf(c))}</span>` : ""}${(t => t ? `<span class="tg tg-${t.k}" title="${esc(t.tip)}">${esc(t.label)}</span>` : "")(cardTags(c)[0])}</button>
      <span class="cap num">${esc(c.set.toUpperCase())} · ${esc((c.released_at || "").slice(0, 4))}</span></div>`).join("")}</div>
    ${sv.next ? `<p><button class="btn" id="smore" ${sv.busy ? "disabled" : ""}>${sv.busy ? "Loading…" : "Load more"}</button></p>` : ""}`;
  el.querySelector(".grid").onclick = e => { const b = e.target.closest("button"); if (b) { if (sv.keepQ && sv.q === sv.keepQ) sv.refocus = true; openCard(sv.results[+b.dataset.i]); } };
  const m = $("#smore"); if (m) m.onclick = async () => {
    sv.busy = true; drawResults();

    sv.busy = false; drawResults();
  };
}

/* ---------- set symbols (from Scryfall's set list, cached on the device for a week) ---------- */
let SETS = null, setsP = null;
function loadSets() {
  if (SETS) return Promise.resolve(SETS);
  if (setsP) return setsP;
  setsP = (async () => {
    let c = null; try { c = idb.ok ? await idbGet("sets") : null; } catch (e) {}
    if (c && c.map) SETS = c.map;
    const counted = c && c.map && Object.values(c.map).some(x => x.count != null && x.rel != null);      // older copies lack release dates: fetch again
    if (!c || !counted || Date.now() - c.at > 7 * 864e5) {
      try {
        const r = await sf("/sets"), map = {};
        for (const z of r.data || []) map[z.code] = { icon: z.icon_svg_uri || "", name: z.name, year: (z.released_at || "").slice(0, 4), rel: z.released_at || "", parent: z.parent_set_code || "", count: z.card_count || 0, printed: z.printed_size || 0, type: z.set_type || "" };
        SETS = map; if (idb.ok) idbSet("sets", { at: Date.now(), map }).catch(() => {});
      } catch (e) { if (!SETS) { setsP = null; throw e; } }
    }
    return SETS;
  })();
  return setsP;
}
// The set symbol, coloured by rarity like on the card (common, uncommon silver, rare gold, mythic orange).
function setIcon(code, rarity, big) {
  const z = SETS && SETS[code]; if (!z || !z.icon || !/^https:\/\/svgs\.scryfall\.io\//.test(z.icon)) return "";
  return `<span class="sym${big ? " big" : ""}" data-r="${esc(rarity || "common")}" style="--sym:url('${esc(z.icon)}')" title="${esc(z.name)}${rarity ? " · " + esc(rarity) : ""}" role="img" aria-label="${esc(z.name)} set symbol"></span>`;
}
async function showPrints(s, onPick, into) {

    const tile = (c, i) => {

    const ids = deckShortfall(d, true).flatMap(x => [x.c.id, CHEAP[x.c.name] && CHEAP[x.c.name].id]).filter(id => id && !(id in o.mp));
    if (!ids.length) { if (o.mpState === "loading") o.mpState = "ok"; return; }
    try { const got = await mpPrices(ids); for (const id of ids) o.mp[id] = got[id] || null; o.mpState = "ok"; }
    catch (e) { o.mpState = "err"; o.mpErr = e.message; }
    draw();
  };
  const draw = () => {
    const el = $("#buyBody"); if (!el) return;
    const hasSide = Object.values(d.cards).some(c => c.side);
    const all = deckShortfall(d, o.side), basics = all.filter(x => x.c.basic || /^Basic\b/.test(x.c.type || "")), list = o.basics ? all : all.filter(x => !basics.includes(x));
    const n = list.reduce((a, x) => a + x.q, 0), atDeck = list.reduce((a, x) => a + (priceOf(x.c) || 0) * x.q, 0), noDeckPrice = list.filter(x => priceOf(x.c) == null).length;
    const looked = list.filter(x => x.c.name in CHEAP), cheapTot = looked.reduce((a, x) => a + ((CHEAP[x.c.name] || {}).price ?? priceOf(x.c) ?? 0) * x.q, 0);
    const allLooked = list.length && looked.length === list.length;
    // Mana Pool: the printing in the deck, or the cheapest printing once it's been found if Mana Pool has it cheaper
    const mpOf = x => { const a = mpPrice(o.mp[x.c.id]), ch = CHEAP[x.c.name], b = ch && ch.id ? mpPrice(o.mp[ch.id]) : null;
      return a == null && b == null ? null : b != null && (a == null || b < a) ? { price: b, url: o.mp[ch.id].url, set: ch.set } : { price: a, url: o.mp[x.c.id].url, set: x.c.set }; };
    const mpRows = list.map(mpOf), mpTot = mpRows.reduce((a, m, i) => a + (m ? m.price * list[i].q : 0), 0), mpMissing = mpRows.filter(m => !m).length;
    const mpAsOf = MP.meta && MP.meta.as_of ? new Date(MP.meta.as_of) : null;
    el.innerHTML = `<h2>Buy what's missing</h2>
      <p class="small muted" style="margin:4px 0 10px">Cards “${esc(d.name)}” needs that you don't have${shareCopies() ? "" : " free (copies used in other decks count as taken)"}. TCGplayer market prices from Scryfall${S.meta.pricedAt ? `, updated ${esc(dayLabel(S.meta.pricedAt))}` : ""}.</p>
      ${hasSide || basics.length ? `<div class="row wrap" style="gap:4px 14px">${hasSide ? `<label class="toggle"><input type="checkbox" id="bySide" ${o.side ? "checked" : ""}> Include sideboard</label>` : ""}${basics.length ? `<label class="toggle"><input type="checkbox" id="byBasic" ${o.basics ? "checked" : ""}> Include basic lands (${basics.reduce((a, x) => a + x.q, 0)})</label>` : ""}</div>` : ""}
      ${!list.length ? `<p class="small">${all.length ? "Only basic lands are missing." : "You have every card in this deck."}</p>` : `
      <div class="summary"><div><span class="label">Cards to buy</span><b class="num">${n}</b></div>
        <div><span class="label">At these printings</span><b class="num gold">${money(atDeck)}</b>${noDeckPrice ? `<span class="small muted">${noDeckPrice} without a price</span>` : ""}</div>
        <div><span class="label">Cheapest printings</span><b class="num ${allLooked ? "up" : "muted"}">${allLooked ? money(cheapTot) : looked.length ? "…" : "—"}</b>${allLooked && atDeck > cheapTot ? `<span class="small up">save ${money(atDeck - cheapTot)}</span>` : ""}</div></div>
      <div class="box" style="gap:2px;padding:8px 12px"><div class="kv"><span class="grow"><b>Mana Pool</b> <span class="small muted">lowest listing${mpAsOf ? `, prices from ${esc(mpAsOf.toLocaleDateString())}` : ""}</span></span>
        <b class="num ${o.mpState === "ok" && !mpMissing ? "gold" : ""}">${o.mpState === "loading" ? "…" : o.mpState === "err" ? "—" : money(mpTot)}</b></div>
        <span class="small muted">${o.mpState === "err" ? esc(o.mpErr) : o.mpState === "ok" && mpMissing ? `${mpMissing} card${mpMissing === 1 ? " isn't" : "s aren't"} listed on Mana Pool, so the total leaves ${mpMissing === 1 ? "it" : "them"} out.` : o.mpState === "ok" ? "Tap a Mana Pool price below to open that card on Mana Pool." : "Loading Mana Pool prices…"}</span></div>
      ${allLooked ? "" : `<div class="row"><button class="btn sm" id="byFind" ${o.busy ? "disabled" : ""}>${o.busy ? `Finding cheapest printings… ${o.done}/${list.length}` : "Find the cheapest printings"}</button><span class="small muted grow">${o.busy ? "" : `about ${Math.max(1, Math.ceil(list.filter(x => !(x.c.name in CHEAP)).length / 2))} seconds`}</span></div>`}
      ${o.err ? `<div class="small down">${esc(o.err)}</div>` : ""}
      <div class="row wrap"><button class="btn primary" id="byCopy">Copy for TCGplayer</button><a class="btn" style="color:inherit;text-decoration:none" href="https://www.tcgplayer.com/massentry" target="_blank" rel="noopener">Open TCGplayer Mass Entry</a><button class="btn" id="byWish">Add to my wishlist</button></div>
      <span class="small muted">Copy, then paste into TCGplayer's Mass Entry box. It finds sellers for every card at once.</span>
      <div class="list" style="margin-top:6px">${list.map(x => { const ch = CHEAP[x.c.name], dp = priceOf(x.c); return `<div class="item"><img loading="lazy" src="${esc(x.c.img || "")}" alt="">
        <div class="tap" style="cursor:default"><div class="name">${x.q}× ${esc(x.c.name)}${x.side ? ` <span class="chip">sideboard</span>` : ""}</div>
          <div class="meta small"><span class="muted">${esc((x.c.set || "").toUpperCase())} #${esc(x.c.num || "")}</span><span class="num">${dp != null ? money(dp) + " ea" : "no price"}</span>
          ${x.c.name in CHEAP ? (ch && ch.price != null ? `<span class="num ${dp == null || ch.price < dp ? "up" : "muted"}">cheapest ${money(ch.price)} · ${esc(ch.set.toUpperCase())}</span>` : `<span class="muted">no cheaper printing found</span>`) : ""}
          ${(() => { const m = mpRows[list.indexOf(x)]; return m ? (m.url ? `<a class="num mplink" href="${esc(m.url)}" target="_blank" rel="noopener">Mana Pool ${money(m.price)}${m.set !== x.c.set ? " · " + esc((m.set || "").toUpperCase()) : ""} ↗</a>` : `<span class="num">Mana Pool ${money(m.price)}</span>`) : o.mpState === "ok" ? `<span class="muted">not on Mana Pool</span>` : ""; })()}</div></div>
        <div class="right"><span class="price gold num">${((ch && ch.price) ?? dp) != null ? money(((ch && ch.price) ?? dp) * x.q) : `<span class="muted">—</span>`}</span></div></div>`; }).join("")}</div>`}`;
    const sd = $("#bySide"); if (sd) sd.onchange = e => { o.side = e.target.checked; draw(); };
    const bb = $("#byBasic"); if (bb) bb.onchange = e => { o.basics = e.target.checked; draw(); };
    const fd = $("#byFind"); if (fd) fd.onclick = async () => {
      o.busy = true; o.err = ""; o.done = list.filter(x => x.c.name in CHEAP).length; draw();
      for (const x of list) { if (!$("#buyBody")) return; if (x.c.name in CHEAP) continue;
        try { await findCheapest(x.c.name); } catch (e) { o.err = "Stopped: " + e.message; break; }
        o.done++; draw(); }
      o.busy = false; draw(); loadMP();
    };
    const cp = $("#byCopy"); if (cp) cp.onclick = async () => { const text = list.map(x => `${x.q} ${x.c.name}`).join("\n");
      try { await navigator.clipboard.writeText(text); toast(`Copied ${list.length} line${list.length === 1 ? "" : "s"}. Paste them into TCGplayer Mass Entry`); }
      catch (e) { openSheet(`<h2>Copy this list</h2><textarea readonly style="min-height:200px" id="byTxt">${esc(text)}</textarea>`, () => buySheet(d)); const t = $("#byTxt"); t.focus(); t.select(); } };
    const wb = $("#byWish"); if (wb) wb.onclick = () => {
      let w = Object.values(S.binders).find(b => b.wish); if (!w) { w = S.binders.wish = { id: "wish", name: "Wishlist", wish: true }; }
      let added = 0; for (const x of list) { const have = Object.values(S.coll).filter(e => e.binder === w.id && e.name === x.c.name).reduce((a, e) => a + e.qty, 0); if (x.q > have) { addToColl(x.c, "nonfoil", x.q - have, w.id, true); added += x.q - have; } }
      save(); toast(added ? `Put ${added} card${added === 1 ? "" : "s"} on ${w.name}` : `They're already on ${w.name}`);
    };
  };
  draw(); loadMP();
}
function deckMenu(d) {
  openSheet(`<h2>${esc(d.name)}</h2>
    <div class="stack" style="margin-top:12px">
      <div class="box"><span class="label">Rename</span><div class="row"><input type="text" id="rn" class="grow" value="${esc(d.name)}" maxlength="60"><button class="btn sm" id="rnGo">Save</button></div></div>
      <div class="box stack" style="gap:8px">${Object.keys(S.decks).length > 1 ? `<button class="btn" id="dCmp">Compare with another deck</button>` : ""}<button class="btn" id="dDup">Duplicate this deck</button>
        <label class="toggle"><input type="checkbox" id="dOpenAdd" ${S.settings.openAfterAdd !== false ? "checked" : ""}> Open a card's screen after adding it from the deck's search box</label>
        <label class="toggle"><input type="checkbox" id="dShare" ${shareCopies() ? "checked" : ""}> Let one copy of a card count toward several decks</label>
        <span class="small muted">Off: each copy belongs to one deck, and copies used in other decks show as not available. Applies to all decks.</span>
        <span class="small muted">Started ${esc(dayLabel(d.created || d.updated))} · last changed ${esc(dayLabel(d.updated))}</span></div>
      <div class="box"><span class="label">Paste a deck list</span>
        <textarea id="pl" placeholder="Commander&#10;1 Atraxa, Praetors' Voice&#10;&#10;Deck&#10;4 Lightning Bolt&#10;2 Counterspell (MH2) 267&#10;1x Sol Ring&#10;&#10;Sideboard&#10;2 Pyroblast"></textarea>
        <button class="btn primary" id="plGo">Add these cards</button><div class="status small" id="plMsg"></div>
        <button class="btn" id="dCsv">Or import a file into this deck (CSV or .txt)</button></div>
      <div class="box"><span class="label">Export</span><textarea id="ex" readonly>${esc(deckText(d))}</textarea><button class="btn" id="cp">Copy list</button></div>
      <div class="box"><span class="label">Missing cards</span><div class="row wrap"><button class="btn" id="miss">Buy what's missing</button></div><span class="small muted">Cost, cheapest printings, a TCGplayer list, or put them on your wishlist.</span></div>
      <div class="box"><button class="btn danger" id="del">Delete deck</button>
        <div class="row" id="delConfirm" hidden><span class="grow small">Delete “${esc(d.name)}” for good?</span><button class="btn sm danger" id="delYes">Delete</button><button class="btn sm" id="delNo">Keep</button></div></div>
    </div>`, () => render());
  $("#rnGo").onclick = () => { const v = $("#rn").value.trim(); if (v) { d.name = v; d.updated = Date.now(); save(); toast("Renamed"); } };
  $("#dDup").onclick = () => { const id = uid(), now = Date.now(), c = JSON.parse(JSON.stringify(d)); Object.assign(c, { id, name: d.name + " (copy)", created: now, updated: now }); S.decks[id] = c; save(); closeSheet(); go("decks", id); toast("Made a copy: " + c.name); };
  const dcm = $("#dCmp"); if (dcm) dcm.onclick = () => { closeSheet(); compareSheet(d.id); };
  $("#dShare").onchange = e => { S.settings.shareCopies = e.target.checked; save(); };
  $("#dOpenAdd").onchange = e => { S.settings.openAfterAdd = e.target.checked; save(); };
  $("#dCsv").onclick = () => pickCSV({ kind: "deck", id: d.id });
  const copy = async (text, el) => { try { await navigator.clipboard.writeText(text); toast("Copied"); } catch (e) { if (el) { el.select(); } toast("Select the text and copy it"); } };
  $("#cp").onclick = () => copy($("#ex").value, $("#ex"));
  $("#miss").onclick = () => { closeSheet(); buySheet(d); };
  $("#del").onclick = () => { $("#delConfirm").hidden = false; };
  $("#delNo").onclick = () => { $("#delConfirm").hidden = true; };
  $("#delYes").onclick = () => { trashDeck(d, "deleted"); delete S.decks[d.id]; save(); deckOpen = null; closeSheet(); toast("Deck deleted", { label: "Undo", fn: () => { S.decks[d.id] = d; S.meta.deckTrash = (S.meta.deckTrash || []).filter(x => x.deck.id !== d.id); save(); render(); } }); };
  $("#plGo").onclick = async () => {
    // the same reader as deck files: headings, "SB:", Archidekt tags, *CMDR*, and Commander lists split by a blank line
    const msg = $("#plMsg"), want = [];
    for (const [q, name, set, num, , board] of textListRows($("#pl").value.split(/\n/).map(l => l.trim())).slice(1)) {
      if (/maybe|consider|token/.test(board)) continue;
      want.push({ qty: Math.max(1, +q || 1), side: /side/.test(board), cmdr: /command/.test(board), ident: listIdent({ name, set, num }), name });
    }
    if (!want.length) { msg.textContent = "Paste one card per line, like “4 Lightning Bolt”."; return; }

    try {
      const missing = [];
      for (let i = 0; i < want.length; i += 75) {
        const chunk = want.slice(i, i + 75), r = await sf("/cards/collection", { identifiers: chunk.map(w => w.ident) }), data = r.data || [];
        for (const w of chunk) {
          const c = matchIdent(data, w.ident);
          if (c) { addToDeck(d, c, w.qty, w.side); if (w.cmdr) { d.format = "commander"; const k = c.id + "|0"; if (!d.cmdr.includes(k) && d.cmdr.length < 2) d.cmdr.push(k); } }
          else missing.push(w.name);

}

/* ---------- start ---------- */
// the Deckhand banner while the installed app opens (about a second; a tap skips it)
function splash() {
  if (!isStandalone() || sessionStorage.getItem("dh-splash")) return () => {};
  try { sessionStorage.setItem("dh-splash", "1"); } catch (e) {}
  const el = document.createElement("div"); el.id = "splash"; el.setAttribute("aria-hidden", "true");
  el.innerHTML = `<img src="images/welcome-800.jpg" srcset="images/welcome-800.jpg 800w, images/welcome-1600.jpg 1600w" sizes="100vw" alt="">`; document.body.appendChild(el);
  const t0 = Date.now(); let gone = false;
  const hide = () => { if (gone) return; gone = true; el.classList.add("out"); setTimeout(() => el.remove(), 400); };
  el.onclick = hide; setTimeout(hide, 4000);
  return () => setTimeout(hide, Math.max(0, 1100 - (Date.now() - t0)));
}
async function boot() {
  const splashDone = splash();
  let stored = null;
  if (idb.ok) { try { stored = await idbGet("state"); } catch (e) { idb.ok = false; } }
  if (stored && stored.coll) { S = stored; migrate(); applySearchPrefs(); sc.mode = S.meta.scanMode || "ask"; sc.auto = S.meta.autoCap !== false; }
  else if (Object.keys(S.coll).length || Object.keys(S.decks).length) await flushSave();     // move older data into the database
  sc.items = Array.isArray(S.scanSession) ? S.scanSession : [];
  Object.assign(stp, S.meta.staples || {});
  go("coll");
  loadNames().catch(() => {});
  loadSets().then(() => { if (tab === "coll" && $("#clist")) drawCollList(); else if (tab === "scan") drawSession(); }).catch(() => {});
  if (S.meta.usedScan) setTimeout(() => getWorkers().catch(() => {}), 2500);
  const sc_ = syncCfg(); if (syncOn(sc_) && !sc_.paused) setTimeout(startSyncLoop, 600);
  if (gdCfg()) { setTimeout(gdAuto, 8000); loadGis().catch(() => {}); }
  setTimeout(checkUpdate, 3000);          // remember which version this is
  splashDone();
  if (Object.keys(S.coll).length && (!S.meta.pricedAt || Date.now() - S.meta.pricedAt > 20 * 36e5)) setTimeout(() => refreshPrices(true), 1500);
}
/* ---------- "a newer version is ready": a page left open (an app in the background, a tab on a tablet) keeps
   running the version it loaded. Every few minutes, and when you come back to it, Deckhand compares the page on the
   server with the one it started from; if they differ it offers Update now, which saves and syncs first. ---------- */
const UPD = { base: null, avail: false, last: 0, busy: false };
function hashText(t) { let h = 2166136261; for (let i = 0; i < t.length; i++) { h ^= t.charCodeAt(i); h = Math.imul(h, 16777619); } return (h >>> 0).toString(36) + ":" + t.length; }
async function checkUpdate() {
  if (UPD.busy || !navigator.onLine) return; UPD.busy = true; UPD.last = Date.now();
  try {
    const r = await fetch(location.pathname + "?update-check=" + Date.now(), { cache: "no-store" }); if (!r.ok) return;
    const h = hashText(await r.text());
    if (!UPD.base) UPD.base = h; else if (h !== UPD.base) showUpdate();
  } catch (e) {} finally { UPD.busy = false; }
}
function showUpdate(needed) {
  UPD.avail = true; let bar = $("#updBar");
  if (!bar) { bar = document.createElement("div"); bar.id = "updBar"; bar.setAttribute("role", "status"); document.body.appendChild(bar); }
  bar.innerHTML = `<span class="grow">${needed ? "<b>Update needed to keep syncing.</b> " : "<b>A new version of Deckhand is ready.</b> "}<span class="small">Your cards are saved and synced first.</span></span><button class="btn sm primary" id="updGo">Update now</button>`;
  $("#updGo").onclick = runUpdate;
}
async function runUpdate() {
  const b = $("#updGo"); if (b) { b.disabled = true; b.textContent = "Saving…"; }
  try {
    await flushSave();
    if (syncOn() && SYNC.dirty && !(isGoogleSync() && !gdSignedIn())) {          // send what's waiting (skip if Google needs a tap)
      if (b) b.textContent = "Syncing…";
      for (let i = 0; i < 100 && SYNC.busy; i++) await sleep(100);
      await Promise.race([syncNow(true), sleep(15000)]);
      for (let i = 0; i < 100 && SYNC.busy; i++) await sleep(100);
    }
    await flushSave();
    if (b) b.textContent = "Updating…";
    const reg = navigator.serviceWorker && await navigator.serviceWorker.getRegistration().catch(() => null);
    if (reg) await Promise.race([reg.update().catch(() => {}), sleep(4000)]);
  } catch (e) {}
  location.reload();
}
if (!/jsdom/i.test(navigator.userAgent)) setInterval(() => { if (!document.hidden) checkUpdate(); }, 5 * 6e4);      // (not in the test harness, where a timer would keep it running)
document.addEventListener("visibilitychange", () => { if (!document.hidden && Date.now() - UPD.last > 60000) checkUpdate(); });
/* ---------- install as an app ---------- */
const INSTALL = { prompt: null };
if ("serviceWorker" in navigator && (location.protocol === "https:" || /^(localhost|127\.0\.0\.1)$/.test(location.hostname))) window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
window.addEventListener("beforeinstallprompt", e => { e.preventDefault(); INSTALL.prompt = e; if (tab === "coll" && !$("#sheetRoot").innerHTML) render(); });
window.addEventListener("appinstalled", () => { INSTALL.prompt = null; S.meta.installed = true; save(); toast("Deckhand is installed. Open it from your home screen"); });
const isStandalone = () => (window.matchMedia && matchMedia("(display-mode: standalone)").matches) || navigator.standalone === true;
function installApp() {
  if (INSTALL.prompt) { INSTALL.prompt.prompt(); INSTALL.prompt.userChoice.finally(() => { INSTALL.prompt = null; render(); }); return; }
  const ios = /iPhone|iPad|iPod/.test(navigator.userAgent);
  openSheet(`<h2>Install Deckhand</h2><p>${ios ? "In Safari, tap the <b>Share</b> button, then <b>Add to Home Screen</b>." : "In Chrome, tap the <b>⋮</b> menu, then <b>Install app</b> (or <b>Add to Home screen</b>)."}</p>
    <p class="small muted">It then opens full screen from its own icon, like any other app, and the app itself loads even with a poor connection. Your cards stay where they are.</p>`);
}
boot();
